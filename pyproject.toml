[project]
name = "projeto-2-crud"
version = "0.1.0"
description = "Projeto CRUD Jornada de Dados"
authors = [
    {name = "Mateus Garcia"}
]
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy (>=2.1.5,<3.0.0)",
    "python-dotenv (>=1.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "pydantic[email] (>=2.14.2,<3.0.0)",
    "fastapi (>=0.150.0,<0.151.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "dotenv (>=0.9.9,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false